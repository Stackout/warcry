<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0618">
<title>Warcry</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Warcry</h1>
  <div class="head-right">
    <span id="latency" class="latency"></span>
    <div id="status" class="status"><span class="dot"></span><span id="statusText">connecting</span></div>
  </div>
</header>
<button id="enable" class="enable" type="button">Tap to enable sound</button>

<section id="view-fish" class="view">
  <main id="rigs"></main>
  <p id="empty" class="empty">No windows attached yet. Start Warcry on your PC and cast a line.</p>
  <section id="stats" class="stats"></section>
  <div class="utility">
    <button id="wake" class="toggle" type="button">Keep screen on</button>
    <button id="sound" class="toggle" type="button">Test sound</button>
  </div>
</section>

<section id="view-deck" class="view" hidden>
  <input id="search" class="search" type="search" placeholder="Search commands" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="pads" class="pads"></div>
  <p id="deckEmpty" class="empty">No phone buttons yet. Tick <b>phone button</b> on a command in the Warcry app.</p>
</section>

<nav class="tabs">
  <button id="tab-fish" data-view="fish" class="on" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c4-5 10-5 14 0-4 5-10 5-14 0z"/><path d="M17 12l4-3v6l-4-3z"/><circle cx="8" cy="11" r="1"/></svg>
    <em>Fish</em>
  </button>
  <button data-view="deck" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <em>Commands</em>
  </button>
</nav>
<script src="/app.js"></script>
</body>
</html>
