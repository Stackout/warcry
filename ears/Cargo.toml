[package]
name = "warcry-ears"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Per-window game audio capture and sound detection for Warcry."
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
serde_json = "1.0.154"
