[package]
name = "warcry-app"
version = "0.2.0"
edition = "2024"
description = "Warcry tray app"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
warcry = { path = ".." }
warcry-ears = { path = "../ears" }
warcry-link = { path = "../link" }
warcry-relay = { path = "../relay" }
warcry-rig = { path = "../rig" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
anyhow = "1.0.104"
dirs = "7.0.0"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
