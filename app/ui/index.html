<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warcry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="logo.png" alt="">
      <div>
        <h1>Warcry</h1>
        <p id="profile-name">No profile</p>
      </div>
    </div>
    <div class="status">
      <span id="status" class="pill off"><i></i><b>Stopped</b></span>
      <span id="ptt" class="hint" hidden></span>
    </div>
    <div class="controls">
      <label class="switch" id="listening-switch">
        <input type="checkbox" id="listening">
        <span class="track"><span class="knob"></span></span>
        <em>Listening</em>
      </label>
      <button id="power" class="power"><span>Start</span></button>
    </div>
  </header>

  <main>
    <aside class="side">
      <section class="card">
        <h2>Profile</h2>
        <select id="profile"></select>
        <div class="row">
          <button id="edit" class="ghost">Edit</button>
          <button id="folder" class="ghost">Folder</button>
        </div>
        <div class="row">
          <button id="new-fishing" class="ghost small">+ Fishing</button>
          <button id="new-starter" class="ghost small">+ Starter</button>
        </div>
        <p id="profile-error" class="error" hidden></p>
      </section>

      <section class="card">
        <h2>Target window</h2>
        <p id="target" class="target">Whatever window is focused</p>
      </section>

      <section class="card">
        <h2>Microphone</h2>
        <select id="device"></select>
      </section>

      <section class="card">
        <h2>Speech model</h2>
        <select id="model"></select>
        <button id="download" class="ghost" hidden>Download model</button>
        <div id="progress" class="progress" hidden>
          <div class="fill"></div>
          <span></span>
        </div>
      </section>

      <section class="card">
        <label class="check">
          <input type="checkbox" id="auto-start">
          <span>Start listening when Warcry opens</span>
        </label>
      </section>
    </aside>

    <section class="stage">
      <nav class="tabs">
        <button data-tab="live" class="active">Live</button>
        <button data-tab="commands">Commands <small id="command-count"></small></button>
        <button data-tab="log">Log</button>
      </nav>

      <div class="tab" id="tab-live">
        <form id="try" class="try">
          <input id="try-text" placeholder="Test a phrase without speaking, e.g. “throw my line”" autocomplete="off">
          <button class="ghost">Test</button>
        </form>
        <p id="try-result" class="try-result"></p>
        <div id="welcome" class="welcome" hidden>
          <img src="logo.png" alt="">
          <h3>Let’s get you set up</h3>
          <p>Create a profile to start. The fishing example casts and reels with your voice, so it’s a good place to begin.</p>
          <button id="welcome-fishing" class="power"><span>Create fishing profile</span></button>
        </div>
        <ol id="feed" class="feed"></ol>
        <div id="feed-empty" class="empty">
          <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
          <p>Say a command. What Warcry hears shows up here.</p>
        </div>
      </div>

      <div class="tab" id="tab-commands" hidden>
        <div class="editor" id="editor" hidden>
          <label>Name<input id="d-name" placeholder="heal pet" autocomplete="off"></label>
          <label>Say<input id="d-phrase" placeholder="heal [my;] pet" autocomplete="off"></label>
          <label>Press<input id="d-keys" placeholder="shift+3" autocomplete="off"></label>
          <label>Hotkey<input id="d-hotkey" placeholder="optional, ctrl+alt+h" autocomplete="off"></label>
          <label>Window<input id="d-window" list="window-list" placeholder="whatever is focused" autocomplete="off"></label>
          <datalist id="window-list"></datalist>
          <label>Send<select id="d-mode">
            <option value="background">in the background, no focus steal</option>
            <option value="focus_restore">focus it, then give focus back</option>
            <option value="focus">focus it and leave it focused</option>
          </select></label>
          <label class="check"><input type="checkbox" id="d-active"> Works even while not listening</label>
          <div class="editor-row">
            <button id="d-save" class="primary">Save</button>
            <button id="d-cancel">Cancel</button>
            <span id="d-error" class="missing"></span>
          </div>
        </div>
        <button id="add-command" class="primary">Add a command</button>
        <ul id="commands" class="commands"></ul>
      </div>

      <div class="tab" id="tab-log" hidden>
        <pre id="log" class="log"></pre>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
