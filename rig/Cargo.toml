[package]
name = "warcry-rig"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Ties per-window game audio to the Warcry companion relay."
license = "MIT"
publish = false

[[bin]]
name = "warcry-rig"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
qrcode = { version = "0.14.1", default-features = false }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
warcry = { path = "..", default-features = false }
warcry-ears = { path = "../ears" }
warcry-link = { path = "../link" }
warcry-relay = { path = "../relay" }
