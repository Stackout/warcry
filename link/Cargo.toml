[package]
name = "warcry-link"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Wire protocol between the Warcry desktop relay and the Warcry phone companion."
license = "MIT"
publish = false

[dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
