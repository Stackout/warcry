[package]
name = "warcry"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform voice command engine for games and apps. Speak, and Warcry presses the keys."
license = "MIT"
readme = "README.md"
keywords = ["voice", "speech", "macro", "gaming", "automation"]
categories = ["command-line-utilities", "accessibility", "games"]

[workspace]
members = [".", "app", "link", "ears", "relay", "rig", "hub"]

[features]
default = ["whisper", "download"]
whisper = ["dep:whisper-rs"]
download = ["dep:ureq"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
device_query = "4.0.1"
dirs = "7.0.0"
enigo = "0.6.1"
hound = "3.5.1"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
strsim = "0.11.1"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.1", optional = true }
whisper-rs = { version = "0.16.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "3.0.12"
